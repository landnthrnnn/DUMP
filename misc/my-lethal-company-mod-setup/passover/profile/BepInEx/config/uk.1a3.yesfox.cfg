# Default value: 100
# Acceptable value range: From -1 to 100
Fox Spawn Chance = 50

[Moon Overrides.Trenches]

## Controls whether weeds can spawn on Trenches at all. This is the master switch for this moon.
# Setting type: Boolean
# Default value: false
Enable Weed Spawning = false

## Enable per-moon overrides for weed settings (spawn/growth chance, etc). If this is false, the global settings will be used.
# Setting type: Boolean
# Default value: false
Enable Weed Overrides = true

## Override the weed spawn chance for Trenches when you are currently routed to it.
# Setting type: Single
# Default value: 8.5
# Acceptable value range: From 0 to 100
Spawn Chance (While Routed) = 0

## Override the weed spawn chance for Trenches when you are routed to another moon.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0 to 100
Spawn Chance (While Not Routed) = 0

## Override the weed growth chance for Trenches when you are currently routed to it.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 100
Growth Chance (While Routed) = 0

## Override the weed growth chance for Trenches when you are routed to another moon.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 100
Growth Chance (While Not Routed) = 0

## Override the global maximum weed iterations for Trenches.
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 1 to 20
Maximum Iterations = 1

## Override the global minimum distance for weed growth on Trenches.
# Setting type: Single
# Default value: 40
# Acceptable value range: From 30 to 70
Minimum Distance = 30

## Enable per-moon overrides for fox settings (minimum weeds, spawn chance). If this is false, the global settings will be used.
# Setting type: Boolean
# Default value: false
Enable Fox Overrides = true

## Override the minimum weeds required for a fox to spawn on Trenches.
# Setting type: Int32
# Default value: 10
Fox Minimum Weeds = 10

## Override the spawn chance for a fox on Trenches. Set to -1 to use the vanilla spawn logic.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From -1 to 100
Fox Spawn Chance = -1

[Weed Spawning]

## Should weeds be able to spawn on all moons excluding gordion?
# Setting type: Boolean
# Default value: false
All Moons = true

## What should the chance for them to initially spawn the moon you are routed to be? Weeds attempt to spawn on all moons when you go into orbit after each day.
# Setting type: Single
# Default value: 8.5
# Acceptable value range: From 0 to 100
Spawn Chance (Current Moon) = 8.5

## What should the chance for them to initially spawn on other moons be? Weeds attempt to spawn on all moons when you go into orbit after each day.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0 to 100
Spawn Chance (Other Moons) = 4

## What is the chance that weeds should grow another "step" after leaving a moon? This applies at the end of the day, only once the spawn chance has succeeded for the first time.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 100
Growth Chance (Current Moon) = 100

## What is the chance that weeds should grow another "step" for all other moons? This applies at the end of the day, only once the spawn chance has succeeded for the first time.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 100
Growth Chance (Other Moons) = 100

## How many days in a row are additional weeds allowed to grow on the same moon?
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 1 to 20
Maximum Iterations = 20

## How many units away from the ship must the starting points for weed growth be?
# Setting type: Single
# Default value: 40
# Acceptable value range: From 30 to 70
Minimum Distance = 40

