[Animation Timing]

## How long the top text displays on screen in seconds (e.g., 3.0 for 3 seconds)
# Setting type: Single
# Default value: 3
TopTextDisplayDuration = 4

## How long the interior text displays on screen in seconds (e.g., 3.0 for 3 seconds)
# Setting type: Single
# Default value: 3
InteriorTextDisplayDuration = 4

## How long the top text takes to fade in (e.g., 0.5 for half a second)
# Setting type: Single
# Default value: 0.5
TopTextFadeInDuration = 1.5

## How long the top text takes to fade out (e.g., 0.5 for half a second)
# Setting type: Single
# Default value: 0.5
TopTextFadeOutDuration = 1.5

## How long the interior text takes to fade in (e.g., 0.5 for half a second)
# Setting type: Single
# Default value: 0.5
InteriorTextFadeInDuration = 1.5

## How long the interior text takes to fade out (e.g., 0.5 for half a second)
# Setting type: Single
# Default value: 0.5
InteriorTextFadeOutDuration = 1.5

## Delay in seconds before the top text starts displaying after entering (e.g., 1.0 for 1 second)
# Setting type: Single
# Default value: 0
TopTextStartDelay = 0

## Delay in seconds before the interior text starts displaying after entering (e.g., 1.0 for 1 second)
# Setting type: Single
# Default value: 0
InteriorTextStartDelay = 1.5

[Custom Images]

## Enable or disable all custom image functionality
# Setting type: Boolean
# Default value: true
EnableCustomImages = true

## Image display type
# Setting type: ImageDisplayType
# Default value: BothSeparate
# Acceptable values: TopTextOnly, InteriorTextOnly, BothSeparate, Combined
ImageDisplayType = BothSeparate

## Image source mode
# Setting type: ImageSourceMode
# Default value: BothDeveloperPriority
# Acceptable values: DeveloperOnly, UserOnly, BothDeveloperPriority, BothUserPriority
ImageSourceMode = BothDeveloperPriority

## Comma-separated list of image paths to exclude (e.g., dev/name/interiortext,user/othername/toptext)
# Setting type: String
# Default value: 
ImageBlacklist = 

## Position of top images as X,Y coordinates
# Setting type: String
# Default value: 0,20
TopImagePosition = 0,20

## Position of interior images as X,Y coordinates
# Setting type: String
# Default value: 0,-20
InteriorImagePosition = 0,-20

## Position of combined images as X,Y coordinates
# Setting type: String
# Default value: 0,0
CombinedImagePosition = 0,0

## Width for top text images in pixels (0 = use original width)
# Setting type: Int32
# Default value: 400
TopTextImageWidth = 400

## Height for top text images in pixels (0 = use original height)
# Setting type: Int32
# Default value: 40
TopTextImageHeight = 40

## Width for interior text images in pixels (0 = use original width)
# Setting type: Int32
# Default value: 400
InteriorTextImageWidth = 400

## Height for interior text images in pixels (0 = use original height)
# Setting type: Int32
# Default value: 40
InteriorTextImageHeight = 40

## Width for combined images in pixels (0 = use original width)
# Setting type: Int32
# Default value: 400
CombinedImageWidth = 400

## Height for combined images in pixels (0 = use original height)
# Setting type: Int32
# Default value: 40
CombinedImageHeight = 40

