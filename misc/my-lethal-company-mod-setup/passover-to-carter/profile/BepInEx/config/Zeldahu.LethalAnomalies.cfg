[Spark Tower]

## The spawn chance weight for the Spark Tower, relative to other existing enemies.
## Comma separated list allowing you to specify a value for each moon, including modded moons.
## Goes up from 0, lower is more rare, 100 and up is very common.
# Setting type: String
# Default value: ExperimentationLevel:50,AssuranceLevel:15,VowLevel:20,OffenseLevel:80,MarchLevel:55,AdamanceLevel:5,RendLevel:20,DineLevel:15,ArtificeLevel:20,EmbrionLevel:100,Bozoros:35,Infernis:25,Synthesis:25
Spawn weight = -1

## The power level of the tower. General setting that applies for all moons.
# Setting type: Single
# Default value: 1
Power level = 1

## The maximum amount of towers that spawn on a moon. General setting that applies for all moons.
# Setting type: Int32
# Default value: 10
Max count = 3

## The range at which the tower detects and attacks enemies.
# Setting type: Single
# Default value: 30
Effective Range = 30

## Determines how long it takes for the tower to attack players while they stand in its detection range.
## Lower values make the tower attack faster, higher values require players to stand close for longer before being attacked.
# Setting type: Single
# Default value: 2.5
Attack speed = 2.5

## Modifies how long the tower takes after attacking, before detecting players again. 
## The normal cooldown value is randomly chosen between 3-10 seconds.
# Setting type: Single
# Default value: 1
Cooldown multiplier = 1

[Spark Tower Alternative Behavior]

## Check this to enable the alternative behavior for the spark tower. 
## While this is on, the tower will repeatedly emit sparks towards players within range and line of sight. 
## If a player is zapped 12 times (configurable) in a row, they will be hit by lightning and die. 
## Break line of sight to reset the counter. Recommended for larger groups.
# Setting type: Boolean
# Default value: false
Enabled = false

## How many times a player can be zapped by the spark tower in a row before triggering the lightning.
# Setting type: Int32
# Default value: 12
Alternative attack Threshold = 12

[Tour Bus]

## How many tourists are required to spawn before a tour bus appears on the moon.
# Setting type: Int32
# Default value: 20
Spawn Threshold = 8

## Determines whether mobs can trigger the tour bus by walking into it. Enabling this will make you run the risk of tourists all blowing up randomly.
# Setting type: Boolean
# Default value: false
Can be triggered by mobs = false

