# Default value: false
Configure Content = false

## These are the names which LunarConfig will recognize as this object in other config options.
## They are case-insensitve and do not regard whitespace.
# Setting type: String
# Default value: VileVendingMachine, Vile Vending Machine, Vilevendingmachine
Appropriate Aliases = VileVendingMachine, Vile Vending Machine, Vilevendingmachine

## Specifies the name of the enemy that appears on its scan node.
# Setting type: String
# Default value: Vile Vending Machine
Scan Name = Vile Vending Machine

## Specifies the subtext that appears on the enemy's scan node.
# Setting type: String
# Default value: 
Scan Subtext = 

## The maximum amount of an enemy that can be alive.
# Setting type: Int32
# Default value: 1
Max Count = 1

## The diversity power level an enemy occupies.
# Setting type: Int32
# Default value: 0
Diversity Power Level = 0

## Tags allocated to the enemy.
## Separate tags with commas.
# Setting type: String
# Default value: 
Tags = 

