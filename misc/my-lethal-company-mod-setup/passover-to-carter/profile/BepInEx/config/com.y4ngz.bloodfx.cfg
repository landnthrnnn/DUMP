## Settings file was created by plugin BloodVFX v1.0.0
## Plugin GUID: com.y4ngz.bloodfx

[08 - Blood FX]

## Master switch for the blood burst, splatter, and body-blood system.
# Setting type: Boolean
# Default value: true
Enabled = true

## Most wall and floor blood decals alive at once. Decals last the whole round; past this many the oldest is recycled. Set to 0 to place none.
# Setting type: Int32
# Default value: 48
# Acceptable value range: From 0 to 256
World Decal Cap = 48

## Most blood decals carried on one player's body. They survive healing and clear on respawn or round end. Set to 0 to disable body blood.
# Setting type: Int32
# Default value: 4
# Acceptable value range: From 0 to 12
Body Decal Cap Per Player = 4

## Most blood decals carried on one creature body. Creature blood has its own channel so it cannot evict player hit or finisher blood. Set to 0 to disable it.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 0 to 24
Creature Body Decal Cap = 10

## Most blood decals carried in one player's finisher channel. This is separate from ordinary hit blood and clears with the other body channels on respawn or round end. Set to 0 to disable finisher body blood.
# Setting type: Int32
# Default value: 6
# Acceptable value range: From 0 to 16
Finisher Body Decal Cap = 6

## Allow damage dealt to Bundy to place replicated blood decals on his body. Set off to keep the general Blood FX system while disabling Bundy damage blood.
# Setting type: Boolean
# Default value: true
Enable Bundy Damage Blood = true

## Scales particle emission and the number of decals placed per hit. Damage amount still picks the small/medium/heavy tier.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.1 to 3
Intensity Multiplier = 1

## How long a recycled blood decal takes to dissolve away. When a cap is reached the oldest decal fades out over this many seconds instead of vanishing mid-view. A fading decal has already left the cap queue, so this never costs you live blood. Set to 0 to remove recycled decals instantly, as before.
# Setting type: Single
# Default value: 1.2
# Acceptable value range: From 0 to 10
Decal Fade Seconds = 1.2

## Most blood events one player can produce per second. Damage-over-time sources (turret bursts, mines, drowning, the chainsaw) otherwise fire up to eight times a second each and churn the whole world decal cap in a couple of seconds. Hits past the limit are skipped entirely — no burst, no splatter, no body blood. Set to 0 for no limit (duplicate-event suppression still applies).
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 20
Max Blood Events Per Second = 2

## Metres from your camera past which a hit places no burst, spray, or wall/floor splatter. Damage runs on every client, so without this a hit across the map spends world decal slots on blood nobody will ever see — evicting the blood in the room you are standing in. Body blood and death puddles ignore this, because both persist and can be walked up to later. Set to 0 to place blood at any distance.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 500
Max Viewer Distance = 100

## Stop the game's own pooled blood splats from spawning so only this system's blood shows. Snow footprints are unaffected.
# Setting type: Boolean
# Default value: true
Suppress Vanilla Blood Pools = true

## Write one diagnostic line per blood event (hit, environment splatter, body decal, death) plus a one-time material audit of each player's suit. Hits are rare, so the volume is low; turn it off once the system is dialled in.
# Setting type: Boolean
# Default value: false
Debug Logging = false

## Interior wall and tile materials ship with HDRP's 'Receive Decals' turned off, so blood sprayed onto a wall was placed but never drawn (floors receive, walls did not). When on, the first blood decal to land on a surface flips that material to decal-receiving. Visual-only, applies to static room geometry, and each material is processed once.
# Setting type: Boolean
# Default value: true
Enable Decals On Room Materials = true

## ESCAPE HATCH, off by default. Puts body blood on HDRP DecalLayer7 and grants that layer only to the wounded player's renderers, so the projector physically cannot paint anything else. Verified broken in the shipped build: the HDRP asset reports supportDecalLayers=true but no shader in the game data carries the DECAL_LAYERS variant, so layered decals draw nothing at all. Held items are kept clean by the item material shield instead. Only turn this on if a future game or mod update ships the missing shader variants.
# Setting type: Boolean
# Default value: false
Isolate Body Decals On Decal Layer = false

